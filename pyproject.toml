[project]
name = "balatro-web-api"
version = "0.1.0"
description = "HTTP API to play Balatro runs, with the exact game logic of BalatroEngine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "balatroengine>=0.3.0",
    "fastapi>=0.115",
    "pyjwt[crypto]>=2.10",
    "uvicorn>=0.30",
]

[project.scripts]
balatro-api = "balatro_api.main:run"

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.sources]
balatroengine = { git = "https://github.com/ArnoStar/BalatroEngine.git", tag = "v0.3.0" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["balatro_api"]

[[tool.mypy.overrides]]
module = ["balatro", "balatro.*"]
ignore_missing_imports = true
